<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="Full quality animated badge">
  <defs>
    <linearGradient id="q-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#021a15"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="q-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="q-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="392" height="192" rx="20" fill="url(#q-bg)"/>
  <rect x="4" y="4" width="392" height="192" rx="20" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
  <circle cx="200" cy="100" r="80" fill="url(#q-glow)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(36,52)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#q-accent)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <path d="M26 14 V32 M26 32 L16 22 M26 32 L36 22" fill="none" stroke="#021a15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="100" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ecfdf5">کیفیت کامل</text>
  <text x="36" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#a7f3d0">• بهترین فرمت video+audio به‌صورت ترکیبی</text>
  <text x="36" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#a7f3d0">• رزولوشن بالا + bitrate بهینه</text>
