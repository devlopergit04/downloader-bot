<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" role="img" aria-label="Command showcase animated">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#022c22"/>
      <stop offset="1" stop-color="#021a15"/>
    </linearGradient>
    <linearGradient id="c-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="500" height="320" rx="18" fill="url(#c-bg)"/>
  <rect x="0" y="0" width="500" height="46" rx="18" fill="#064e3b"/>
  <rect x="0" y="30" width="500" height="16" fill="#064e3b"/>
  <circle cx="26" cy="23" r="5" fill="#10b981"/><circle cx="44" cy="23" r="5" fill="#34d399"/><circle cx="62" cy="23" r="5" fill="#a7f3d0"/>
  <text x="250" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#d1fae5">Chat</text>

  <!-- user message -->
  <g transform="translate(60,70)">
    <rect x="0" y="0" width="220" height="56" rx="14" fill="#10b981">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#021a15">/start</text>
    <text x="20" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#022c22">سلام ربات آماده‌ست</text>
  </g>

  <!-- bot message -->
  <g transform="translate(220,70)">
    <rect x="0" y="0" width="220" height="56" rx="14" fill="#021a15" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ecfdf5">یک لینک بفرست…</text>
    <text x="20" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#a7f3d0">https://youtu.be/…</text>
  </g>

  <!-- progress message with filling bar -->
  <g transform="translate(60,150)">
    <rect x="0" y="0" width="260" height="56" rx="14" fill="#064e3b"/>
    <text x="20" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d1fae5">⬇️ در حال دانلود…</text>
    <rect x="20" y="32" width="220" height="10" rx="5" fill="#022c22"/>
    <rect x="20" y="32" width="0" height="10" rx="5" fill="url(#c-fill)">
      <animate attributeName="width" values="0;170;220;170;0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="200" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ecfdf5">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      77%
    </text>
  </g>

  <!-- result message -->
  <g transform="translate(220,210)">
    <rect x="0" y="0" width="220" height="80" rx="14" fill="#021a15" stroke="#34d399" stroke-width="2"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#10b981">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
    </rect>
    <path d="M34 28 V46 M34 46 L26 38 M34 46 L42 38" fill="none" stroke="#021a15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ecfdf5">✅ دانلود کامل</text>
    <text x="72" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a7f3d0">ویدیو · yt-dlp · 480 MB</text>
  </g>
</svg>
