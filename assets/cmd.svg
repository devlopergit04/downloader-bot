<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" role="img" aria-label="Command showcase">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="500" height="320" rx="18" fill="url(#c-bg)"/>
  <rect x="0" y="0" width="500" height="46" rx="18" fill="#1e1b4b"/>
  <rect x="0" y="30" width="500" height="16" fill="#1e1b4b"/>
  <circle cx="26" cy="23" r="5" fill="#6366f1"/>
  <circle cx="44" cy="23" r="5" fill="#14b8a6"/>
  <circle cx="62" cy="23" r="5" fill="#8b5cf6"/>
  <text x="250" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e0e7ff">Chat</text>

  <!-- user message -->
  <g transform="translate(60,70)">
    <rect x="0" y="0" width="220" height="56" rx="14" fill="#6366f1"/>
    <text x="20" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">/start</text>
    <text x="20" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e0e7ff">سلام ربات آماده‌ست</text>
  </g>

  <!-- bot message -->
  <g transform="translate(220,70)">
    <rect x="0" y="0" width="220" height="56" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">یک لینک بفرست…</text>
    <text x="20" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">https://youtu.be/…</text>
  </g>

  <!-- progress message -->
  <g transform="translate(60,150)">
    <rect x="0" y="0" width="260" height="56" rx="14" fill="#1e1b4b"/>
    <text x="20" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c7d2fe">⬇️ در حال دانلود…</text>
    <rect x="20" y="32" width="220" height="10" rx="5" fill="#312e81"/>
    <rect x="20" y="32" width="170" height="10" rx="5" fill="#14b8a6"/>
    <text x="200" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">77%</text>
  </g>

  <!-- result message -->
  <g transform="translate(220,210)">
    <rect x="0" y="0" width="220" height="80" rx="14" fill="#ffffff" stroke="#14b8a6"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#14b8a6"/>
    <path d="M34 28 V46 M34 46 L26 38 M34 46 L42 38" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">✅ دانلود کامل</text>
    <text x="72" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">ویدیو · yt-dlp · 480 MB</text>
  </g>
</svg>
