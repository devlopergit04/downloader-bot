<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Architecture diagram animated">
  <defs>
    <linearGradient id="box-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="box-deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065f46"/><stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="box-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <text x="600" y="44" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ecfdf5">معماری ربات</text>

  <!-- User -->
  <g transform="translate(60,120)">
    <rect x="0" y="0" width="180" height="80" rx="14" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="40" cy="40" r="16" fill="#064e3b"/>
    <text x="70" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ecfdf5">کاربر</text>
  </g>

  <!-- Telegram -->
  <g transform="translate(300,120)">
    <rect x="0" y="0" width="180" height="80" rx="14" fill="url(#box-deep)" stroke="#10b981" stroke-width="2"/>
    <text x="90" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ecfdf5">Telegram API</text>
  </g>

  <!-- Engine -->
  <g transform="translate(540,120)">
    <rect x="0" y="0" width="200" height="80" rx="14" fill="url(#box-green)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="44" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ecfdf5">Downloader Engine</text>
    <text x="100" y="66" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#a7f3d0">شناسایی + مسیریابی</text>
  </g>

  <!-- animated arrows -->
  <g stroke="#10b981" stroke-width="2" stroke-dasharray="6 6">
    <line x1="240" y1="160" x2="300" y2="160" stroke-width="2" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="480" y1="160" x2="540" y2="160" stroke-width="2" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="0.7s" begin="0.2s" repeatCount="indefinite"/>
    </line>
  </g>
  <line x1="740" y1="160" x2="740" y2="300" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="300" x2="740" y2="300" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="300" x2="940" y2="300" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- three engines -->
  <g transform="translate(640,330)">
    <rect x="0" y="0" width="200" height="90" rx="14" fill="url(#box-accent)"/>
    <text x="100" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#021a15">yt-dlp</text>
    <text x="100" y="64" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#021a15">ویدئو / صدا</text>
    <text x="100" y="80" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#021a15">کیفیت کامل</text>
  </g>
  <g transform="translate(860,330)">
    <rect x="0" y="0" width="200" height="90" rx="14" fill="url(#box-deep)" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ecfdf5">gallery-dl</text>
    <text x="100" y="64" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a7f3d0">تصاوير / گالری</text>
    <text x="100" y="80" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#a7f3d0">باکیفیت</text>
  </g>
  <g transform="translate(1080,330)">
    <rect x="0" y="0" width="120" height="90" rx="14" fill="#021a15" stroke="#10b981" stroke-width="2"/>
    <text x="60" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ecfdf5">HTTP</text>
    <text x="60" y="64" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#a7f3d0">فایل مستقیم</text>
  </g>

  <!-- result back -->
  <path d="M1080 330 C 1080 200, 240 200, 240 100" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <text x="660" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#34d399">فایل کامل برمی‌گرد</text>
</svg>
