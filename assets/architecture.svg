<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Architecture diagram">
  <defs>
    <linearGradient id="box-indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="box-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="box-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="600" y="44" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">معماری ربات</text>

  <!-- User -->
  <g transform="translate(60,120)">
    <rect x="0" y="0" width="180" height="80" rx="14" fill="none" stroke="#64748b" stroke-width="2"/>
    <circle cx="40" cy="40" r="16" fill="#e2e8f0"/>
    <text x="70" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">کاربر</text>
  </g>

  <!-- Telegram -->
  <g transform="translate(300,120)">
    <rect x="0" y="0" width="180" height="80" rx="14" fill="url(#box-violet)"/>
    <text x="90" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff">Telegram API</text>
  </g>

  <!-- Engine -->
  <g transform="translate(540,120)">
    <rect x="0" y="0" width="200" height="80" rx="14" fill="url(#box-indigo)"/>
    <text x="100" y="44" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff">Downloader Engine</text>
    <text x="100" y="66" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e0e7ff">شناسایی + مسیریابی</text>
  </g>

  <!-- arrows -->
  <line x1="240" y1="160" x2="300" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="160" x2="540" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="160" x2="740" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="300" x2="740" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="300" x2="940" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- three engines -->
  <g transform="translate(640,330)">
    <rect x="0" y="0" width="200" height="90" rx="14" fill="url(#box-teal)"/>
    <text x="100" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff">yt-dlp</text>
    <text x="100" y="64" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ccfbf1">ویدئو / صدا</text>
    <text x="100" y="80" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#99f6e4">کیفیت کامل</text>
  </g>
  <g transform="translate(860,330)">
    <rect x="0" y="0" width="200" height="90" rx="14" fill="url(#box-violet)"/>
    <text x="100" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff">gallery-dl</text>
    <text x="100" y="64" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ede9fe">تصاوير / گالری</text>
    <text x="100" y="80" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#ddd6fe">باکیفیت</text>
  </g>
  <g transform="translate(1080,330)">
    <rect x="0" y="0" width="120" height="90" rx="14" fill="#0f172a"/>
    <text x="60" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff">HTTP</text>
    <text x="60" y="64" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">فایل مستقیم</text>
  </g>

  <!-- result back -->
  <path d="M1080 330 C 1080 200, 240 200, 240 100" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="660" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#0d9488">فایل کامل برمی‌گرد</text>
</svg>
