<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cloud download animated">
  <defs>
    <linearGradient id="c-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="url(#c-grad)" stroke-width="3"/>
  <path d="M20 38 a12 12 0 0 1 11-20 a13 13 0 0 1 25 3 a10 10 0 0 1 -2 20 Z" fill="#052e26" stroke="#10b981" stroke-width="2.5"/>
  <!-- raining particles -->
  <g fill="#34d399">
    <circle cx="26" cy="46" r="2"><animate attributeName="cy" values="46;60;46" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="34" cy="46" r="2"><animate attributeName="cy" values="46;60;46" dur="1.4s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="42" cy="46" r="2"><animate attributeName="cy" values="46;60;46" dur="1.1s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>
  <!-- down arrow -->
  <path d="M32 12 V30 M24 22 L32 30 L40 22" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 4; 0 0" dur="1.2s" repeatCount="indefinite"/>
  </path>
</svg>
