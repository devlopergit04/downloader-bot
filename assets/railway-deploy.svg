<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Run In Railway — deploy on Railway" style="cursor:pointer">
  <title>Run In Railway — Deploy</title>
  <desc>Animated railway banner with a running train on tracks. Click anywhere to open the Railway deploy link.</desc>
  <defs>
    <linearGradient id="railway-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0C14"/>
      <stop offset="0.5" stop-color="#181428"/>
      <stop offset="1" stop-color="#0D0C14"/>
    </linearGradient>
    <linearGradient id="railway-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#6912B9"/>
    </linearGradient>
    <linearGradient id="railway-purple-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b6cff"/>
      <stop offset="1" stop-color="#6912B9"/>
    </linearGradient>
    <radialGradient id="railway-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="railway-track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3550"/>
      <stop offset="1" stop-color="#221d33"/>
    </linearGradient>
    <filter id="railway-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <a xlink:href="https://railway.com/deploy/bTZe1m" href="https://railway.com/deploy/bTZe1m" target="_blank" rel="noopener noreferrer">
    <!-- background -->
    <rect width="1200" height="360" fill="url(#railway-bg)"/>
    <circle cx="980" cy="70" r="230" fill="url(#railway-glow)">
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="340" r="210" fill="url(#railway-glow)" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.65;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- floating particles -->
    <g fill="#8B5CF6">
      <circle cx="110" cy="60" r="3"><animate attributeName="cy" values="60;42;60" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="100" r="2.5"><animate attributeName="cy" values="100;82;100" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="920" cy="150" r="3"><animate attributeName="cy" values="150;132;150" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="200" r="2.5"><animate attributeName="cy" values="200;182;200" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="70" r="2.5"><animate attributeName="cy" values="70;54;70" dur="4.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="4.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ===== Header: logo badge + title + deploy CTA ===== -->
    <!-- Railway logo badge -->
    <g transform="translate(70,52)">
      <rect x="0" y="0" width="84" height="84" rx="22" fill="url(#railway-purple-v)">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <!-- exact Railway logo (Simple Icons vector) -->
      <g fill="#FFFFFF" transform="translate(42,42) scale(2.17) translate(-12,-12)">
        <path d="M.113 10.27A13.026 13.026 0 000 11.48h18.23c-.064-.125-.15-.237-.235-.347-3.117-4.027-4.793-3.677-7.19-3.78-.8-.034-1.34-.048-4.524-.048-1.704 0-3.555.005-5.358.01-.234.63-.459 1.24-.567 1.737h9.342v1.216H.113v.002zm18.26 2.426H.009c.02.326.05.645.094.961h16.955c.754 0 1.179-.429 1.315-.96zm-17.318 4.28s2.81 6.902 10.93 7.024c4.855 0 9.027-2.883 10.92-7.024H1.056zM11.988 0C7.5 0 3.593 2.466 1.531 6.108l4.75-.005v-.002c3.71 0 3.849.016 4.573.047l.448.016c1.563.052 3.485.22 4.996 1.364.82.621 2.007 1.99 2.712 2.965.654.902.842 1.94.396 2.934-.408.914-1.289 1.458-2.353 1.458H.391s.099.42.249.886h22.748A12.026 12.026 0 0024 12.005C24 5.377 18.621 0 11.988 0z"/>
      </g>
    </g>

    <!-- title + subtitle -->
    <text x="180" y="106" font-family="Inter, 'Inter Tight', Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Run In Railway</text>
    <text x="184" y="136" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#9BA3B4">Deploy your app in seconds — click anywhere to launch</text>

    <!-- deploy CTA button (with soft pulse ring) -->
    <g transform="translate(184,152)">
      <rect x="-3" y="-3" width="196" height="52" rx="26" fill="#8B5CF6" opacity="0">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="190" height="46" rx="23" fill="url(#railway-purple)">
        <animate attributeName="opacity" values="0.92;1;0.92" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="24" y="29" font-family="Inter, 'Inter Tight', Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Deploy →</text>
    </g>

    <!-- ===== Railway tracks (bottom) ===== -->
    <g>
      <rect x="0" y="300" width="1200" height="7" rx="3.5" fill="url(#railway-track)"/>
      <rect x="0" y="315" width="1200" height="7" rx="3.5" fill="url(#railway-track)"/>
      <!-- sleepers moving left for motion -->
      <g fill="#2A2F45">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;-48 0" dur="0.8s" repeatCount="indefinite"/>
          <rect x="0" y="292" width="14" height="42" rx="2"/>
          <rect x="48" y="292" width="14" height="42" rx="2"/>
          <rect x="96" y="292" width="14" height="42" rx="2"/>
          <rect x="144" y="292" width="14" height="42" rx="2"/>
          <rect x="192" y="292" width="14" height="42" rx="2"/>
          <rect x="240" y="292" width="14" height="42" rx="2"/>
          <rect x="288" y="292" width="14" height="42" rx="2"/>
          <rect x="336" y="292" width="14" height="42" rx="2"/>
          <rect x="384" y="292" width="14" height="42" rx="2"/>
          <rect x="432" y="292" width="14" height="42" rx="2"/>
          <rect x="480" y="292" width="14" height="42" rx="2"/>
          <rect x="528" y="292" width="14" height="42" rx="2"/>
          <rect x="576" y="292" width="14" height="42" rx="2"/>
          <rect x="624" y="292" width="14" height="42" rx="2"/>
          <rect x="672" y="292" width="14" height="42" rx="2"/>
          <rect x="720" y="292" width="14" height="42" rx="2"/>
          <rect x="768" y="292" width="14" height="42" rx="2"/>
          <rect x="816" y="292" width="14" height="42" rx="2"/>
          <rect x="864" y="292" width="14" height="42" rx="2"/>
          <rect x="912" y="292" width="14" height="42" rx="2"/>
          <rect x="960" y="292" width="14" height="42" rx="2"/>
          <rect x="1008" y="292" width="14" height="42" rx="2"/>
          <rect x="1056" y="292" width="14" height="42" rx="2"/>
          <rect x="1104" y="292" width="14" height="42" rx="2"/>
          <rect x="1152" y="292" width="14" height="42" rx="2"/>
        </g>
      </g>
    </g>

    <!-- ===== Running train (animated left -> right) ===== -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-380 0;1260 0" dur="7s" repeatCount="indefinite" calcMode="linear"/>

      <!-- smoke puffs (rise + fade) -->
      <g fill="#8B5CF6" opacity="0.85">
        <circle cx="40" cy="222" r="10"><animate attributeName="cy" values="222;176;146" dur="2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.85;0.2;0" dur="2.1s" repeatCount="indefinite"/><animate attributeName="r" values="10;18;22" dur="2.1s" repeatCount="indefinite"/></circle>
        <circle cx="40" cy="222" r="8"><animate attributeName="cy" values="222;182;154" dur="2.1s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.85;0.2;0" dur="2.1s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="r" values="8;16;20" dur="2.1s" begin="0.7s" repeatCount="indefinite"/></circle>
        <circle cx="40" cy="222" r="9"><animate attributeName="cy" values="222;178;148" dur="2.1s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.85;0.2;0" dur="2.1s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="r" values="9;17;21" dur="2.1s" begin="1.4s" repeatCount="indefinite"/></circle>
      </g>

      <!-- motion lines behind -->
      <g stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" opacity="0.5">
        <line x1="-20" y1="250" x2="-90" y2="250"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="0.8s" repeatCount="indefinite"/></line>
        <line x1="-20" y1="258" x2="-100" y2="258"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="0.8s" begin="0.3s" repeatCount="indefinite"/></line>
        <line x1="-20" y1="242" x2="-85" y2="242"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="0.8s" begin="0.15s" repeatCount="indefinite"/></line>
      </g>

      <!-- wheels (rotating, resting on rails) -->
      <g fill="#0D0C14" stroke="#4a3a66" stroke-width="2">
        <g><animateTransform attributeName="transform" type="rotate" values="0 70 307;360 70 307" dur="0.9s" repeatCount="indefinite"/>
          <circle cx="70" cy="307" r="13"/>
          <line x1="70" y1="294" x2="70" y2="320" stroke="#4a3a66" stroke-width="2"/>
          <line x1="57" y1="307" x2="83" y2="307" stroke="#4a3a66" stroke-width="2"/>
        </g>
        <g><animateTransform attributeName="transform" type="rotate" values="0 120 307;360 120 307" dur="0.9s" repeatCount="indefinite"/>
          <circle cx="120" cy="307" r="13"/>
          <line x1="120" y1="294" x2="120" y2="320" stroke="#4a3a66" stroke-width="2"/>
          <line x1="107" y1="307" x2="133" y2="307" stroke="#4a3a66" stroke-width="2"/>
        </g>
        <g><animateTransform attributeName="transform" type="rotate" values="0 168 307;360 168 307" dur="0.9s" repeatCount="indefinite"/>
          <circle cx="168" cy="307" r="13"/>
          <line x1="168" y1="294" x2="168" y2="320" stroke="#4a3a66" stroke-width="2"/>
          <line x1="155" y1="307" x2="181" y2="307" stroke="#4a3a66" stroke-width="2"/>
        </g>
      </g>

      <!-- undercarriage -->
      <rect x="26" y="284" width="206" height="20" rx="9" fill="#1a1626"/>
      <!-- main body -->
      <path d="M30 246 Q30 232 44 232 L196 232 Q222 232 222 246 L222 284 L30 284 Z" fill="url(#railway-purple-v)"/>
      <!-- front nose cap -->
      <path d="M196 232 Q222 232 222 246 L222 284 L196 284 Z" fill="#6912B9"/>
      <!-- window strip -->
      <rect x="48" y="240" width="138" height="12" rx="6" fill="#1a1626" opacity="0.9"/>
      <rect x="54" y="242" width="126" height="4" rx="2" fill="#8B5CF6" opacity="0.7"/>
      <!-- cab window -->
      <rect x="176" y="244" width="32" height="18" rx="4" fill="#1a1626"/>
      <rect x="180" y="247" width="24" height="6" rx="3" fill="#8B5CF6"/>
      <!-- headlight -->
      <circle cx="218" cy="262" r="4" fill="#FFFFFF"/>
      <circle cx="218" cy="262" r="9" fill="#FFFFFF" opacity="0.25" filter="url(#railway-soft)">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <!-- chimney -->
      <rect x="58" y="212" width="14" height="22" rx="3" fill="#4a3a66"/>
    </g>
  </a>
</svg>
