<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Audio animated">
  <defs>
    <linearGradient id="a-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="url(#a-grad)" stroke-width="3"/>
  <g fill="url(#a-grad)" stroke="none">
    <rect x="17" y="26" width="4" height="14" rx="2">
      <animate attributeName="height" values="14;24;14" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="26;16;26" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="25" y="20" width="4" height="26" rx="2">
      <animate attributeName="height" values="26;14;26" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="20;30;20" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="33" y="16" width="4" height="32" rx="2">
      <animate attributeName="height" values="32;18;32" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="16;26;16" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="41" y="22" width="4" height="22" rx="2">
      <animate attributeName="height" values="22;12;22" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="22;32;22" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
