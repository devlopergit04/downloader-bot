<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Animated loader">
  <defs>
    <linearGradient id="ld-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ld-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022c22"/>
      <stop offset="1" stop-color="#021a15"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#ld-bg)" stroke="#065f46" stroke-width="2"/>
  <g transform="translate(60,60)">
    <circle cx="0" cy="0" r="36" fill="none" stroke="#064e3b" stroke-width="6"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#ld-grad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="60 170">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle cx="36" cy="0" r="4" fill="#34d399"/>
    </g>
  </g>
</svg>
