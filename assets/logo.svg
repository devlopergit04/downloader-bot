<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Downloader Bot animated logo">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="lg-arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="lg-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#lg-bg)"/>
  <circle cx="64" cy="64" r="52" fill="url(#lg-glow)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="url(#lg-arrow)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 8; 0 0" dur="1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
      <path d="M64 26 V74"/>
      <path d="M44 60 L64 80 L84 60" stroke="#34d399"/>
    </g>
    <rect x="36" y="92" width="56" height="10" rx="5" fill="#10b981" stroke="none"/>
  </g>
  <circle cx="64" cy="74" r="3" fill="#a7f3d0"/>
</svg>
