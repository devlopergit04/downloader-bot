name: Windows Release

# Trigger by pushing a v* tag, publishing a Release, or manually.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        default: 'v1.0.0'
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows x64 / AMD64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          # make NSIS available to later steps
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisDir) {
            [System.Environment]::SetEnvironmentVariable("PATH", "$nsisDir;" + [System.Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH","User"), "Machine")
          }

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-gui.txt pyinstaller

      - name: Build portable exe (PyInstaller)
        shell: powershell
        run: |
          pyinstaller --onefile --windowed --name DownloaderBot `
            --icon assets/logo.ico `
            --collect-all yt_dlp --collect-all gallery_dl `
            --collect-all certifi --collect-all websockets `
            gui_main.py
          Test-Path "dist\DownloaderBot.exe"

      - name: Build Setup.exe (NSIS)
        shell: powershell
        run: |
          $env:PATH += ";C:\Program Files (x86)\NSIS;C:\Program Files\NSIS"
          Write-Host "makensis path: $((Get-Command makensis -ErrorAction SilentlyContinue).Source)"
          Write-Host "installer.nsi exists: $(Test-Path build/installer.nsi)"
          Write-Host "dist exe exists: $(Test-Path dist/DownloaderBot.exe)"
          makensis build/installer.nsi *>&1 | Tee-Object -FilePath nsis.log
          if ($LASTEXITCODE -ne 0) {
            $log = Get-Content nsis.log -Raw
            $body = @{ title = "NSIS build error"; body = "Run ${{ github.run_id }} on ${{ github.sha }}`n````n$log`n````n" } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/issues" -Method Post -Headers @{ Authorization = "Bearer ${{ github.token }}"; "Accept" = "application/vnd.github+json" } -Body $body
            exit 1
          }
          Move-Item -Force "DownloaderBot-Setup-1.0.0.exe" "DownloaderBot-Setup-win-x64.exe"

      - name: Stage portable exe
        shell: powershell
        run: Copy-Item "dist\DownloaderBot.exe" "DownloaderBot-portable-win-x64.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            DownloaderBot-Setup-win-x64.exe
            DownloaderBot-portable-win-x64.exe

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: ls -la release-assets

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name || 'v1.0.0' }}
          name: "Downloader Bot — Windows (x64 / AMD64)"
          body: |
            ## Downloader Bot — Windows Setup (x64 / AMD64)

            Two downloadable artifacts are attached:

            - **DownloaderBot-Setup-win-x64.exe** — NSIS installer (64-bit / AMD64). Run it to install; creates desktop + Start-menu shortcuts and an uninstaller.
            - **DownloaderBot-portable-win-x64.exe** — portable single-file executable (no install needed).

            ### Note on architectures
            AMD64 and X64 both refer to the same 64-bit x86 architecture. PyQt6 (the GUI toolkit) only ships 64-bit Windows wheels, so a 32-bit (x86) build is not available.

            ### Install / run
            Run the Setup.exe (or the portable exe), then launch **Downloader Bot** and add any media URL to download.

            🤖 Built automatically by GitHub Actions.
          files: release-assets/*.exe
