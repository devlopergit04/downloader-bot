name: Windows Release

# Manually trigger, or run when a GitHub Release is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        default: 'v1.0.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build Setup.exe (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # x64 = AMD64 (64-bit), x86 = 32-bit.
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-gui.txt pyinstaller

      - name: Generate icon
        shell: powershell
        run: python build/make_icon.py

      - name: Build frozen app (PyInstaller)
        shell: powershell
        run: |
          pyinstaller --clean --noconfirm build/downloader-bot.spec

      - name: Build Setup.exe (NSIS)
        shell: powershell
        run: |
          makensis build/installer.nsi
          # name per architecture
          Move-Item -Force "DownloaderBot-Setup-1.0.0.exe" "DownloaderBot-Setup-win-${{ matrix.arch }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.arch }}
          path: DownloaderBot-Setup-win-${{ matrix.arch }}.exe

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show assets
        run: ls -la release-assets

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name || 'v1.0.0' }}
          name: "Downloader Bot — Windows Setup"
          body: |
            ## Downloader Bot — Windows Setup

            Two Windows installers are attached:

            - **DownloaderBot-Setup-win-x64.exe** — AMD64 / 64-bit
            - **DownloaderBot-Setup-win-x86.exe** — 32-bit (x86)

            ### Install
            Run the Setup.exe, follow the installer, then launch **Downloader Bot** from the desktop or Start menu. Add any media URL to download.

            🤖 Built automatically by GitHub Actions.
          files: release-assets/*.exe
